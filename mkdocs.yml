site_name: AI戦略実践プロジェクト
site_description: 事業を動かす方々のための、AI戦略実装の型を月次で作る・動かす実践の場（主催：栗山実／株式会社アンテカニス）
site_author: AI戦略実践プロジェクト
site_url: https://ai-strategy.antecanis.com/

theme:
  name: material
  language: ja
  custom_dir: overrides
  logo: assets/logo-mincho-white.svg
  favicon: assets/favicon.png
  # ダークモードは置かない（2026年9月に廃止）。ホームとランディング系ページは常に明るい地で
  # 描くので、切り替えが効くのは本文ページだけという中途半端な状態になっていた。
  # palette を1つ（マッピング）にすると、Material は切り替えボタンも、以前に選んだ
  # 配色を localStorage から戻すスクリプトも出さない（ダークを選んでいた人も明るい地に戻る）
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Noto Sans JP
    code: Roboto Mono
  features:
    # 用語集ツールチップ（abbreviations）を有効化
    - content.tooltips
    - content.code.copy
    # 上部タブ＋サイドバーのポータル型ナビゲーション
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - stylesheets/extra.css

# フォーム（/subscribe/・/join/corporate/）の送信、UTM の保持、計測（GA4・Meta・Google 広告）。
# 全ページで読み込むが、フォームの無いページでは UTM を覚えて、ページビューと申込クリックを送るだけ。
# schedule.js は、開催日が過ぎた日程を、次のビルドを待たずに「開催済み」にする（hooks/schedule.py と同じ決まり）
extra_javascript:
  - javascripts/forms.js
  - javascripts/schedule.js

# 日本語（CJK）対応の abbreviations ツールチップを有効化する hook
# seo_files.py は AIO 用の llms.txt をビルド時に生成する（extra: と各ページの description から）
hooks:
  # 回の予定（extra.schedule）から、次回・開催済み・開催履歴の日付を作る（最初に動く）
  - hooks/schedule.py
  - hooks/abbr_cjk.py
  - hooks/seo_files.py
  - hooks/export_data.py
  # 広告の計測タグを、Material を通らない静的ページ（/welcome/・/paused/）にも差し込む
  - hooks/tracking.py
  # 見出しの日本語を句の切れ目で改行する（テンプレートのフィルター phrase。BudouX）
  - hooks/phrases.py
  # 広告用LP の画像に幅と高さを書く（テンプレートの img_attrs。読み込みで文がずれないように）
  - hooks/img_size.py

# 日本語検索対応（CJK 分割に対応）
plugins:
  - search:
      lang:
        - ja
        - en
  # 変動情報の単一ソース化（extra: のデータ／main.py のマクロを各ページで参照）
  - macros:
      module_name: main
  # 統合・改称した旧URLの転送（メール等で配布済みのリンクを切らさない）
  - redirects:
      redirect_maps:
        join/register.md: join/index.md
        # 月次テーマは開催履歴と同じ内容だったので統合（2026年9月）
        sessions/themes.md: sessions/history.md
        # 開催予定はセッションページに吸収（2026年9月）
        sessions/schedule.md: sessions/index.md
        # スタートガイドはライブラリー（B）の /guide/ へ移設（2026年9月）。
        # **外部URLへの転送**（プラグインが対応している）。案内メール・決済完了
        # ページ・Circle から配ったリンクが生きているので、この設定は消さないこと。
        # ⚠ 行き先のホストは2026年9月に ai-strategy-news → ai-strategy-library へ改称。
        # 旧ホストも同じ配信先に付いたままなので、古い転送先でも開けはする
        start-guide.md: https://ai-strategy-library.antecanis.com/guide/getting-started/
        # 旧来の申込リンク /apply/（送信済みの案内メールに残っている）。以前は GAS を
        # 直に開く静的HTMLだったが、申込（Stripe）の入口 extra.join_url へ転送する。
        # 行き先は下の extra.join_url と**同じ値**（YAML のアンカー &join_url を
        # extra.join_url が *join_url で参照）。申込URLを変えるときはここ1か所。消さないこと
        apply/index.md: &join_url https://go.antecanis.com/ai-strategy-join
  # スクリーンショット等をクリックで拡大
  - glightbox:
      auto_caption: false
      touchNavigation: true
  # OGP / ソーシャルカードの自動生成（SEO・共有）
  # フォント取得にネットワークを要するため、生成は CI 等でのみ有効化する。
  # ローカルビルドは `CARDS` 未設定＝無効（既定）。CI では env: CARDS: true。
  - social:
      cards: !ENV [CARDS, false]
      cards_layout_options:
        background_color: "#004455"
        color: "#ffffff"

markdown_extensions:
  # 用語集ツールチップ（*[TERM]: 定義 形式）
  - abbr
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - admonition
  - toc:
      permalink: true
      # CJK 見出しでも意味のあるアンカーを生成（Unicode保持）。
      # 既定の slugify は非ASCIIを除去し _2 等になるため上書き。
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # 全ページに用語集の定義を自動付与（ツールチップ用）
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
      auto_append:
        - includes/abbreviations.md

# ツールチップ用のインクルードと、サイズの大きい元画像はページ化・配信しない
exclude_docs: |
  includes/
  assets/antecanis_favicon.png
  assets/antecanis_logo_ss.png
  assets/antecanis_logo_white.png
  assets/profile_kuriyama_DSC2043.jpg
  assets/profile_kuriyama_DSC2043_s.jpg
  assets/profile_kuriyama_DSC2043_s2.jpg

nav:
  - ホーム: index.md
  # 申込の判断に効くものだけを「プロジェクトについて」に置く。
  # 「このプロジェクトを紹介する」（紹介用チラシ）は既存参加者向けなので nav から外した
  # ―― ページは残っており、URLを知っていれば開ける。
  - プロジェクトについて:
      - 背景と狙い: about/index.md
      - セッションの進め方と開催予定: sessions/index.md
      - 開催履歴: sessions/history.md
      - 設計思想: about/philosophy.md
      - 主催者プロフィール: about/profile.md
      # 関連リンク（ライブラリー・メンバーサイト・主催会社）。**タブは増やさない**
      # ―― ここは「プロジェクトについて」の配下で、申込導線の外側に置く札
      - 関連リンク: about/links.md
  # 用語集はライブラリー（B）の /terms/ に移した。ページは前のURLのまま残して
  # あるが、nav・検索・sitemap・llms.txt からは外している（ダイジェストと同じ扱い）
  # スタートガイドもライブラリー（B）の /guide/ に移した（2026年9月）。あちらは
  # **参加している方の手元**という位置づけで、今後ガイドを増やしていく置き場。
  # こちらは転送だけ残す（下の redirect_maps）。nav には戻さない。
  - 参加する:
      - 参加費とお申し込み: join/index.md
      - 法人の方へ: join/corporate.md
  # ⚠ ライブラリー（B）へのタブは**置かない**。このサイトは広告からの申込
  # コンバージョンが目的で、グローバルナビの項目は申込導線から目を逸らす。
  # B への導線は「プロジェクトについて」の本文とフッタに置く（下記 §導線の方針）。

extra:
  # フッターの「Made with Material for MkDocs」を出さない（2026-11-14、栗山さん）
  generator: false
  # GA4（Material の標準の組み込み）。広告のタグは下の tracking:
  analytics:
    provider: google
    property: G-2H53XSH9YC

  # ────────────────────────────────────────────────────────────
  # 広告の計測タグ（2026年11月〜）。**ID が空なら、そのタグは一切読み込まない。**
  # overrides/partials/tracking.html が全ページに、hooks/tracking.py が /welcome/・/paused/ に
  # 入れる。送るイベントは docs/javascripts/forms.js（メール登録の成功＝Lead・コンバージョン、
  # 申込（Stripe）ボタンのクリック＝InitiateCheckout・コンバージョン、法人問い合わせ＝Contact）。
  # 本番ホスト（hosts）以外では動かない ―― ローカルの確認や検証用の面で数字を汚さないため。
  # 試すときは META_PIXEL_ID=… TRACKING_HOSTS=127.0.0.1 python3 -m mkdocs serve
  # ────────────────────────────────────────────────────────────
  tracking:
    # Meta ピクセルの ID（数字だけ）
    meta_pixel_id: !ENV [META_PIXEL_ID, "1933755187988577"]
    # Google 広告のタグ ID（AW-で始まる）
    google_ads_id: !ENV [GOOGLE_ADS_ID, "AW-18550105733"]
    # コンバージョンのラベル（Google 広告で作ったコンバージョンの「AW-…/」の後ろ）。空なら送らない
    google_ads_lead_label: !ENV [GOOGLE_ADS_LEAD_LABEL, "EgymCPnUkLAdEIXNsI1F"]   # メール登録
    google_ads_join_label: !ENV [GOOGLE_ADS_JOIN_LABEL, "XkiDCOiwr7AdEIXNsI1F"]   # 申込（Stripe）ボタンのクリック
    google_ads_inquiry_label: !ENV [GOOGLE_ADS_INQUIRY_LABEL, "hVsDCMG3qbAdEIXNsI1F"]   # 法人問い合わせの送信
    google_ads_signup_label: !ENV [GOOGLE_ADS_SIGNUP_LABEL, "qPRtCOi3o7kdEIXNsI1F"]   # 申込完了（Stripe のあとの /welcome/）
    # LinkedIn の Insight Tag（パートナー ID・数字）と、コンバージョンの ID（数字）。空なら読み込まない・送らない。
    # 入れるときは、プライバシーポリシーの外部送信の表に LinkedIn を足すこと
    linkedin_partner_id: !ENV [LINKEDIN_PARTNER_ID, ""]
    linkedin_lead_conversion: !ENV [LINKEDIN_LEAD_CONVERSION, ""]       # 報告メール・メール登録（新規）
    linkedin_join_conversion: !ENV [LINKEDIN_JOIN_CONVERSION, ""]       # 申込（Stripe）ボタンのクリック
    linkedin_signup_conversion: !ENV [LINKEDIN_SIGNUP_CONVERSION, ""]   # 申込完了（/welcome/）
    # タグを動かすホスト（カンマ区切り）
    hosts: !ENV [TRACKING_HOSTS, "ai-strategy.antecanis.com"]

  # ────────────────────────────────────────────────────────────
  # 変動情報の単一ソース（§3）。更新は毎回このブロックだけ。
  # ホーム(overrides/home.html)・/sessions/・join 等が参照する。
  # ────────────────────────────────────────────────────────────
  # メール登録の入口。**サイト内のページ**（2026年9月〜。以前は Mailchimp のホスト型LP）。
  # サイト相対で書く（テンプレートとマクロが各ページからの相対パスに直す）
  register_url: subscribe/
  # フォームの送信先・Turnstile・ご案内メールの件名（/subscribe/・/join/corporate/ が参照）
  forms:
    # ゲートウェイ（go.antecanis.com）。検証用リビジョンで試すときは
    # FORMS_API_BASE=https://staging---… python3 -m mkdocs serve
    api_base: !ENV [FORMS_API_BASE, "https://go.antecanis.com"]
    # Cloudflare Turnstile のサイトキー（公開してよい値。ウィジェット「AISIA forms」）。
    # 空にすると、/subscribe/ と /join/corporate/ はフォームの代わりに旧LP・メールへの導線を出す
    turnstile_sitekey: !ENV [TURNSTILE_SITEKEY, "0x4AAAAAAFFE4MRIh0cbQOTJ"]
    # 登録直後に届くご案内メールの件名（実際のメールと一致させる。thanks に表示）
    welcome_subject: "【AI戦略実践PJ】メール登録ありがとうございます"
    # JavaScript が無効な方の代替（旧LP。過去の投稿からもリンクされているので残してある）
    noscript_url: https://mailchi.mp/antecanis/ai-strategy
    # 「知ったきっかけ」は任意（2026年11月〜）。**空欄のときに送る値**（空のまま送る。ゲートウェイ v10 から
    # 受け付け、Mailchimp の SOURCE001 は空のまま・タグは src:none）
    source_blank: ""
  # ────────────────────────────────────────────────────────────
  # 広告用LP（/start/。overrides/start.html）の、回ごと・時期ごとに変わる文と画像。
  # 構成と文面はテンプレートの中（栗山さんの仕様。変えるときは栗山さんに確認する）。
  # ⚠ 新しい回のたびに見直す（CLAUDE.md の毎回の更新チェックリスト）：
  #   practice_example … 「得られるもの」の毎月の実践の回。直近の回と次の回を1文ずつ
  #   recent_text      … 「実際の回から」の短い紹介。recent_round が extra.history の先頭の回と
  #                      違うときは使わず、history の highlight（無ければ summary）を出す
  #   recent_prompt    … 「実際の回から」のお題（任意。recent_round が先頭の回と同じときだけ出す）
  #   recent_quote     … 「実際の回から」の引用（任意。画面の中の一文を文字で。recent_round が先頭の回と同じときだけ）
  #                      recent_quote_note はその出どころ。参加者の文は使わない（主催者の画面・AIの応答など）
  #   ⚠ 第7回以降も「公開」「コードは書きません」とは書かない。問い（戦略の分かれ目）を先に、作る・動かすはその材料として
  #   ⚠ LP の文では回を開催月で呼ぶ（「10月の回」。A日程の月）。「第6回」とは書かない（栗山さん、2026-11-15）
  # ────────────────────────────────────────────────────────────
  lp:
    practice_example: "10月の回は、全員が同じ問いでAIと対話し、深まりを1往復ごとに点数化して比べました（ニックネームで参加できます）。11月の回は、システム開発のコストとハードルが消えたとき、業界の構造と取るべき戦略がどう変わるかを考えます。その材料として、全員がAIに頼んで、顧客が明日使える小さなサービスを作ります。"
    recent_round: 6
    recent_text: "全員が同じ強さのAIを相手に、同じ問いで対話し、その深まりを1往復ごとに点数化して比べました。分かれ目は入力の長さではなく、問いの立て方でした。"
    recent_prompt: "社長の次の問い「AIへの張り方を絞る。」（張る軸／失うもの／順番）"
    # 第6回の画面の中のAIの応答（主催者の画面。2026-11-15 に栗山さんが引用を了承）
    recent_quote: "全社員にAIを配って2年が経ち、資料作成などの『効率化』は達成されました。しかしその結果起きたのは『同業他社との同質化（平均点化）』です。"
    recent_quote_note: "この回の対話で、AIが返した答えから"
    # 課題の棚の件数（増えていくので「〜超」で書く）
    issues_count: "2,000件超"
    # 「毎朝のAIニュース解釈」（メンバー）と、ライブラリー（登録不要）の違いの一言。空なら出さない
    news_member_note: "コミュニティでは、届いた読み解きをもとに、メンバー同士で考えを交わせます。"
    # 画像（docs/ からの相対パス）。空なら、その枠を出さない（届くまで）。
    # ⚠ 参加者の名前・アイコンが写っていないことを確かめてから置く
    images:   # 空にした枠は出さない。⚠ 参加者の名前・アイコン・会員限定の情報（ボードのコード等）が写っていないかを確かめてから置く
      hero: "assets/img/start/studio.jpg"            # 最初の画面（AI戦略スタジオ）
      hero2: "assets/img/start/app-demo.jpg"         # 最初の画面に重ねる（AIで作った業務アプリの例）
      practice: "assets/img/start/reports.jpg"       # 毎月の実践の回（第5回で生成したレポート）
      practice2: "assets/img/start/board-s06b.jpg"   # 同上に重ねる（第6回の対話アリーナ）
      space: "assets/img/start/space-viewer.jpg"     # メンバースペース（場面ごとのビューア。動画の中のURLはぼかし済み）
      space2: "assets/img/start/kadai.jpg"           # 同上に重ねる（課題の棚）
      news: "assets/img/start/news-circle.jpg"       # 毎朝のAIニュース解釈（コミュニティの投稿）
      library: "assets/img/start/library-digest.jpg" # AI戦略ライブラリー（今日のダイジェスト）
      library2: "assets/img/start/library-companies.jpg" # 同上に重ねる（戦略の棚）
      peers: "assets/img/start/gallery.jpg"          # 仲間（第5回のシナリオ・ギャラリー）
      recent: "assets/img/start/arena-s06a.jpg"      # 実際の回から（空なら extra.history の先頭の highlight_image）
      recent2: "assets/img/start/graph3d.jpg"        # 同上に重ねる（全員の対話の軌跡）
    # 「得られるもの」の画像は 16:9 の枠に切り取って揃える。どこを見せるか（object-position。空なら上の中央）
    focus:
      practice: "0% 50%"   # レポートの一覧の左（表紙）
      library: "0% 50%"    # 今日のダイジェストの左
      peers: "0% 50%"      # ギャラリーの左の画面
    captions:  # 画像の下の短い説明（空なら出さない）
      hero: "左：AI戦略スタジオで、チームで事業の案をつくる。右下：AIで作った業務アプリの例"
      # 携帯の最初の画面では1行に縮める（主催者を最初の画面に入れるため。空なら hero をそのまま出す）
      hero_sp: "AI戦略スタジオ（左）と、AIで作った業務アプリ（右下）"
      practice: "9月の回：AIと書いた未来シナリオのレポート（右下は10月の回の対話アリーナ）"
      space: "メンバースペース：各回を場面ごとに見返す（右下は課題の棚：AIで解決に挑戦できるテーマ集）"
      news: "毎朝のAIニュース解釈：メンバーのコミュニティに届く投稿（例：「EMSが車載の主役に入り、系列の前提が崩れる日」）"
      library: "AI戦略ライブラリー：今日のダイジェスト（右下は戦略の棚：主要企業のAI戦略の発表など）"
      peers: "9月の回のシナリオ・ギャラリー：参加者がAIと作った223本のシナリオを、全員で見比べる"
      recent: "10月の回の対話アリーナ：同じ問いでAIと対話し、深まりを1往復ごとに点数で見る（右下は全員の対話の軌跡）"
  # 実績数値（/subscribe/・/join/corporate/・/start/ の実績帯とチップが参照）。
  # satisfaction は新しい回のアンケートが加わるたびに再計算する（未回答も分母に含める。小数点以下は切り捨て）。
  stats:
    paid_members: "80名超"
    # rounds_label・rounds_note（「6回」「開催（2026年5月から毎月）」）は hooks/schedule.py が日程から作る
    subscribers: "約200名"
    satisfaction: "97%"
    satisfaction_note: "2026年5月〜10月の各回の参加者アンケート（延べ133件）で「参加・視聴して良かった」に「とてもそう思う」「ややそう思う」と回答した割合。"
  # ニュースサイト（B）。nav の「読む」タブと llms.txt の「関連サイト」が参照する
  news_site_url: https://ai-strategy-library.antecanis.com/d/
  # 申込（Stripe）の直リンク。独自ドメイン配下に統一（リンク先の差し替えはゲートウェイ側で行う）
  # ⚠ 値は plugins.redirects の apply/index.md に書いてある（YAML アンカー）。/apply/ の転送先と一致させるため
  join_url: *join_url
  # ────────────────────────────────────────────────────────────
  # 回の予定（2026年11月〜 **日程の正本はここだけ**）。1回＝1要素、開始は日本時間の ISO。
