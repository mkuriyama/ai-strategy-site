  # よくあるご質問（LP は全部。/join/・/sessions/・/subscribe/ は id で選んで出す。main.py の faq()）
  faq:
    - id: purpose
      q: "AIツールの使い方を学ぶ場ですか？"
      a: "いいえ。個別ツールの勉強会は、ほかにも数多くあります。ここでは、AI前提の事業構想と、その実践に焦点を当てます。実践で使うAIの操作は、その場で画面を共有しながら一緒に進めます。"
    - id: it
      q: "ITが苦手でも参加できますか？"
      a: "できます。作るのは主にAIで、手順はすべて画面を共有しながら進め、初めての方向けの手順のガイドもあります。用意していただくのは、Zoomが使えるパソコン、個人のGoogleアカウント（Gmail。Google Colab と資料の共有に使います）、無料版でよいのでいずれかのAIのアカウント（ChatGPT・Claude・Gemini・Copilot など）です。"
    - id: company-pc
      q: "会社のパソコンや、会社のアカウントで参加できますか？"
      a: "参加はできます。ただ、会社のパソコンやアカウントは、セキュリティの設定で使えないサイトやサービスがあることが多いので、私用のパソコンと個人のアカウントをおすすめします。"
    - id: cost
      q: "追加の費用はかかりますか？"
      a: "かかりません。月額のほかに費用をかけなくても、どの体験もできるように用意しています（AIは無料版のアカウントで足ります）。少し費用をかけると、有料のサービスで画像を作るなど、できることが増える場面もあり、その方法もご案内します。"
    - id: mid
      q: "途中の回からでも参加できますか？"
      a: "できます。各回は独立したテーマで、前の回の知識は前提にしません。"
    - id: absent
      q: "当日参加できない回は？"
      a: "録画と資料で、ご自身のタイミングで取り組めます。ただ、各回はその月のA・Bの2日程だけで、同じ回をあとで開くことはありません。参加者同士の気づきの交換や、その場の空気感は当日ならではなので、できるだけ当日のご参加をおすすめします。"
    - id: camera
      q: "当日、カメラや発言は必要ですか？"
      a: "どちらも必須ではありません。カメラは、差し支えなければオンにしていただくと話しやすくなります（参加者の顔は録画に残しません）。ゲーム形式でAIを使う体験では、結果を順位で見ることもあります（ニックネームで参加できます）。特に優れていた方に感想やコツをうかがうことがありますが、声を出せる方にお願いしています。"
    - id: company-info
      q: "自社の情報を話す必要はありますか？"
      a: "いいえ。Zoomのチャットで「自社ではどんなAIを使っていますか」などとうかがうことはありますが、答えるかどうかは自由です。自分の業界で考えてみる場面でも、自社にしづらい方は、なじみのある別の業界で考えていただけます。"
    - id: cancel
      q: "合わなかったら？"
      a: "初回のお支払い日の前日までの解約なら費用はかかりません。その後も、次の更新日の前日までに解約すれば、次の分はかかりません。解約は、Stripe（カード決済の会社）の会員用の画面から、ご自身でいつでもできます。"
    - id: expense
      q: "会社の経費で参加できますか？"
      a: "できます。お申し込み後、Stripeで適格領収書を表示できます。法人で3名以上のご参加なら、請求書の発行と後日のお振込にも対応します。"
  # 参加の前に（/subscribe/ の有償メンバーのカードの下と、/join/ のお申し込みの前）
  participation:
    - title: "いつからでも参加できます。"
      text: "各回は独立したテーマで、前の回の知識は前提にしません。"
    - title: "A日程とB日程は同じ内容です。"
      text: "ご都合のよい日程を選べます。各回を開くのはその月の2日程だけで、同じ回をあとで開くことはありません。"
    - title: "時間は20:00〜22:30ごろです。"
      text: "そのあとの質問と交流（最大60分ほど）は自由参加で、途中で抜けても大丈夫です。録画に残さない時間です。"
    - title: "録画と資料があります。"
      text: "当日参加できない回も、有償メンバーは録画と資料で、ご自身のタイミングで取り組めます。各回を場面ごとに見返せるビューアもあります。"
    - title: "事前課題はありません。"
      text: "当日までの準備は、お申し込み後にご案内します。手順はすべて画面を共有しながら進め、初めての方向けの手順のガイドもあります。"
    - title: "カメラや発言は必須ではありません。"
      text: "ゲーム形式でAIを使う体験では、結果を順位で見ることもありますが、ニックネームで参加できます。"
    - title: "用意するもの："
      text: "Zoom が使えるパソコン、個人の Google アカウント（Gmail。Google Colab と資料の共有に使います）、無料版でよいので ChatGPT・Claude・Gemini・Copilot などいずれかのAIのアカウント。会社のパソコンやアカウントは、セキュリティの設定で使えないサイトやサービスがあることが多いので、私用をおすすめします。"
    - title: "費用："
      text: "無料期間のあとは、月額の参加費（Stripe でのクレジットカード決済）です。追加の費用なしで、どの体験もできるように用意しています（AIは無料版のアカウントで足ります）。"

