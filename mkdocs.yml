site_name: AI戦略実践プロジェクト
site_description: 事業を動かす方々のための、AI戦略実装の型を月次で作る・動かす実践の場（主催：栗山実／株式会社アンテカニス）
site_author: AI戦略実践プロジェクト
site_url: https://ai-strategy.antecanis.com/

theme:
  name: material
  language: ja
  custom_dir: overrides
  logo: assets/logo-mincho-white.svg
  favicon: assets/favicon.png
  palette:
    # ライトモード
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    # ダークモード
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  font:
    text: Noto Sans JP
    code: Roboto Mono
  features:
    # 用語集ツールチップ（abbreviations）を有効化
    - content.tooltips
    - content.code.copy
    # 上部タブ＋サイドバーのポータル型ナビゲーション
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - stylesheets/extra.css

# フォーム（/subscribe/・/join/corporate/）の送信、UTM の保持、送信成功の計測。
# 全ページで読み込むが、フォームの無いページでは UTM を覚えるだけ
extra_javascript:
  - javascripts/forms.js

# 日本語（CJK）対応の abbreviations ツールチップを有効化する hook
# seo_files.py は AIO 用の llms.txt をビルド時に生成する（extra: と各ページの description から）
hooks:
  - hooks/abbr_cjk.py
  - hooks/seo_files.py
  - hooks/export_data.py

# 日本語検索対応（CJK 分割に対応）
plugins:
  - search:
      lang:
        - ja
        - en
  # 変動情報の単一ソース化（extra: のデータ／main.py のマクロを各ページで参照）
  - macros:
      module_name: main
  # 統合・改称した旧URLの転送（メール等で配布済みのリンクを切らさない）
  - redirects:
      redirect_maps:
        join/register.md: join/index.md
        # 月次テーマは開催履歴と同じ内容だったので統合（2026年9月）
        sessions/themes.md: sessions/history.md
        # 開催予定はセッションページに吸収（2026年9月）
        sessions/schedule.md: sessions/index.md
        # スタートガイドはライブラリー（B）の /guide/ へ移設（2026年9月）。
        # **外部URLへの転送**（プラグインが対応している）。案内メール・決済完了
        # ページ・Circle から配ったリンクが生きているので、この設定は消さないこと。
        # ⚠ 行き先のホストは2026年9月に ai-strategy-news → ai-strategy-library へ改称。
        # 旧ホストも同じ配信先に付いたままなので、古い転送先でも開けはする
        start-guide.md: https://ai-strategy-library.antecanis.com/guide/getting-started/
        # 旧来の申込リンク /apply/（送信済みの案内メールに残っている）。以前は GAS を
        # 直に開く静的HTMLだったが、申込（Stripe）の入口 extra.join_url へ転送する。
        # 行き先は下の extra.join_url と**同じ値**（YAML のアンカー &join_url を
        # extra.join_url が *join_url で参照）。申込URLを変えるときはここ1か所。消さないこと
        apply/index.md: &join_url https://go.antecanis.com/ai-strategy-join
  # スクリーンショット等をクリックで拡大
  - glightbox:
      auto_caption: false
      touchNavigation: true
  # OGP / ソーシャルカードの自動生成（SEO・共有）
  # フォント取得にネットワークを要するため、生成は CI 等でのみ有効化する。
  # ローカルビルドは `CARDS` 未設定＝無効（既定）。CI では env: CARDS: true。
  - social:
      cards: !ENV [CARDS, false]
      cards_layout_options:
        background_color: "#004455"
        color: "#ffffff"

markdown_extensions:
  # 用語集ツールチップ（*[TERM]: 定義 形式）
  - abbr
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - admonition
  - toc:
      permalink: true
      # CJK 見出しでも意味のあるアンカーを生成（Unicode保持）。
      # 既定の slugify は非ASCIIを除去し _2 等になるため上書き。
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # 全ページに用語集の定義を自動付与（ツールチップ用）
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
      auto_append:
        - includes/abbreviations.md

# ツールチップ用のインクルードと、サイズの大きい元画像はページ化・配信しない
exclude_docs: |
  includes/
  assets/antecanis_favicon.png
  assets/antecanis_logo_ss.png
  assets/antecanis_logo_white.png
  assets/profile_kuriyama_DSC2043.jpg
  assets/profile_kuriyama_DSC2043_s.jpg
  assets/profile_kuriyama_DSC2043_s2.jpg

nav:
  - ホーム: index.md
  # 申込の判断に効くものだけを「プロジェクトについて」に置く。
  # 「このプロジェクトを紹介する」（紹介用チラシ）は既存参加者向けなので nav から外した
  # ―― ページは残っており、URLを知っていれば開ける。
  - プロジェクトについて:
      - 背景と狙い: about/index.md
      - セッションの進め方と開催予定: sessions/index.md
      - 開催履歴: sessions/history.md
      - 設計思想: about/philosophy.md
      - 主催者プロフィール: about/profile.md
      # 関連リンク（ライブラリー・メンバーサイト・主催会社）。**タブは増やさない**
      # ―― ここは「プロジェクトについて」の配下で、申込導線の外側に置く札
      - 関連リンク: about/links.md
  # 用語集はライブラリー（B）の /terms/ に移した。ページは前のURLのまま残して
  # あるが、nav・検索・sitemap・llms.txt からは外している（ダイジェストと同じ扱い）
  # スタートガイドもライブラリー（B）の /guide/ に移した（2026年9月）。あちらは
  # **参加している方の手元**という位置づけで、今後ガイドを増やしていく置き場。
  # こちらは転送だけ残す（下の redirect_maps）。nav には戻さない。
  - 参加する:
      - 参加費とお申し込み: join/index.md
      - 法人の方へ: join/corporate.md
  # ⚠ ライブラリー（B）へのタブは**置かない**。このサイトは広告からの申込
  # コンバージョンが目的で、グローバルナビの項目は申込導線から目を逸らす。
  # B への導線は「プロジェクトについて」の本文とフッタに置く（下記 §導線の方針）。

extra:
  analytics:
    provider: google
    property: G-2H53XSH9YC

  # ────────────────────────────────────────────────────────────
  # 変動情報の単一ソース（§3）。更新は毎回このブロックだけ。
  # ホーム(overrides/home.html)・schedule・join 等が参照する。
  # ────────────────────────────────────────────────────────────
  # メール登録の入口。**サイト内のページ**（2026年9月〜。以前は Mailchimp のホスト型LP）。
  # サイト相対で書く（テンプレートとマクロが各ページからの相対パスに直す）
  register_url: subscribe/
  # フォームの送信先・Turnstile・ご案内メールの件名（/subscribe/・/join/corporate/ が参照）
  forms:
    # ゲートウェイ（aisia-ops の gateway/）。検証用リビジョンで試すときは
    # FORMS_API_BASE=https://staging---… python3 -m mkdocs serve
    api_base: !ENV [FORMS_API_BASE, "https://go.antecanis.com"]
    # Cloudflare Turnstile のサイトキー（公開してよい値）。⚠ 未設定のままでは送信が 403 になる
    turnstile_sitekey: !ENV [TURNSTILE_SITEKEY, ""]
    # 登録直後に届くご案内メールの件名（Mailchimp のオートメーションと一致させる。thanks に表示）
    welcome_subject: "【AI戦略実践PJ】メール登録ありがとうございます"
    # JavaScript が無効な方の代替（旧LP。過去の投稿からもリンクされているので残してある）
    noscript_url: https://mailchi.mp/antecanis/ai-strategy
  # 実績数値（/subscribe/・/join/corporate/ の実績帯とチップが参照）。
  # satisfaction は新しい回のアンケートが加わるたびに再計算する（未回答も分母に含める）
  stats:
    paid_members: "80名超"
    rounds_label: "第5回"
    rounds_note: "まで開催（2026年5月〜）"
    subscribers: "約200名"
    satisfaction: "97%"
    satisfaction_note: "第1〜5回の参加者アンケート（延べ117件）で「参加・視聴して良かった」に「とてもそう思う」「ややそう思う」と回答した割合。"
  # ニュースサイト（B）。nav の「読む」タブと llms.txt の「関連サイト」が参照する
  news_site_url: https://ai-strategy-library.antecanis.com/d/
  # 申込（Stripe）の直リンク。独自ドメイン配下に統一（リンク先の差し替えはゲートウェイ側で行う）
  # ⚠ 値は plugins.redirects の apply/index.md に書いてある（YAML アンカー）。/apply/ の転送先と一致させるため
  join_url: *join_url
  # ヘッダー／導線で使う短縮表記（直近に開催される回）
  next_session_short: "10/2(金) 20:00〜"
  # 次回回の配列（ラベル／種別 main|sub／日付／補足／start=ISO日時。start は構造化データ Event 用）
  # theme は任意。決まっているときだけ日付の下に出る（直前まで決めきれないことが多いので空でよい）
  sessions:
    - label: "第5回 B日程"
      kind: sub
      date: "10/2(金) 20:00〜"
      start: "2026-10-02T20:00:00+09:00"
      theme: "AI戦略の未来シナリオ"
      note: "第5回（9/15）と同内容の追加開催。A日程に都合が合わない方向け。有償メンバーは初月無料。"
    - label: "第6回 A日程"
      kind: main
      date: "10/20(火) 20:00〜"
      start: "2026-10-20T20:00:00+09:00"
      note: "オンライン(Zoom)／火曜開催のメイン日程。各回は独立で途中参加歓迎。"
  # ホーム「新着」の先頭リンク（新しい回が終わったらここを更新）
  latest_digest:
    url: "sessions/history/"
    label: "第5回までの開催履歴を公開中"
  # 開催履歴（sessions/history.md が history_cards() で描画。新しい回が終わったら先頭に追加）
  # image は docs/ 基準のパス。各回ダイジェストの図1を assets/img/history/ に切り出してある。
  # digests は**リンクではなく対応表**。公開ページからは外してあり、
  # `DIGEST_EXPORT=1` のビルドで本文を書き出すときだけ使う（会員限定の場所へ運ぶ材料）。
  # highlight（2〜4文）・highlight_image・highlight_caption・month は任意。/subscribe/ の
  # 「直近の回から」が**先頭の回**の値を出す（highlight が無ければ summary、画像が無ければ画像なし）
  history:
    - round: 5
      title: "AI戦略の未来シナリオ"
      area: "[3D] 時間軸戦略のシフト／[3E] 収益構造と戦場のシフト"
      # ⚠ B日程（10/2）が終わったら「開催予定」を外す
      dates: "9/15(火)・10/2(金・開催予定)"
      month: "2026年9月"
      summary: "AIによって産業構造が激変する未来シナリオを描けるか、対話AIに聞く以上の広さと深さでシナリオを出し切れるか、自社の判断によって分かれる道筋を描けるかに挑戦した。"
      image: "assets/img/history/vol-05-highlight.gif"
      highlight: "業界の未来シナリオと、自社の判断で分かれる道筋を、数十ページのレポートとして各自がAIで描きました。簡易的な試作とはいえ、かつて戦略コンサルが数ヶ月をかけた規模の作業が、約10分・API費用数百円で形になります。では、誰もが使えるいま、差はどこでつくのか。そこまでを議論しました。"
      highlight_image: "assets/img/history/vol-05-highlight.gif"
      highlight_caption: "参加者がAIで生成したシナリオレポートの一部"
    - round: 4
      title: "物理世界に接地したAIは、競争のルールをどう書き換えるか"
      area: "[1E] 物理世界との接地と作用"
      dates: "8/18(火)・9/3(木)"
      summary: "航空写真をAIが読み進めて候補地を探す実践アプリと、Sense→Think→Actのループを通じて、誰でも簡単に作れる時代の競争優位がどこに宿るのかを架空企業のストーリーで考えた回。"
      image: "assets/img/history/vol-04.svg"
      digests: ["digests/vol-04.md", "digests/vol-04b.md"]
    - round: 3
      title: "AI戦略 × 組織レイヤーへのインパクト"
      area: "[2A] 情報流通の血流化／[2D] 経営の知的オペレーション機構化／[2E] 事業戦略と組織戦略の共転換"
      dates: "7/21(火)・8/3(月)"
      summary: "暗黙知の表出化、人材と課題の意味マッチング、集合知のリアルタイム構造化、そして「250名分の仕事が浮く」設定で利害の衝突に向き合う人材戦略デザインゲーム。組織変革レイヤーを実地で扱った回。"
      image: "assets/img/history/vol-03.svg"
      digests: ["digests/vol-03.md", "digests/vol-03b.md"]
    - round: 2
      title: "AIと共に、戦略の大転換を考える"
      area: "[3A] 顧客価値／[3B] 顧客接点／[3C] 差別化資産のシフト"
      dates: "6/23(火)・7/10(金)"
      summary: "AI戦略対抗戦とAI事業デザインゲームの2つを通じて、競争のルール（顧客価値・顧客接点・差別化資産）がAIでどう書き換わるかを体験。戦略を「AIと共に、AIを前提に」描き直した回。"
      image: "assets/img/history/vol-02.svg"
      digests: ["digests/vol-02.md", "digests/vol-02b.md"]
    - round: 1
      title: "人間の認知容量の解除 ── 情報×AIの戦略インパクト"
      area: "[1A] 人間の認知容量の解除"
      dates: "5/26(火)・6/15(月)"
      summary: "世界のビジネスニュースを題材に、人間の認知容量の限界が事業戦略上のボトルネックになる場面を言語化し、情報取得から分析・可視化・自動配信・アプリ化までを段階的に体験したパイロット回。"
      image: "assets/img/history/vol-01.svg"
      digests: ["digests/vol-01.md", "digests/vol-01b.md"]
  # 参加費（home のティーザー／join の正本が参照）
  pricing:
    early_label: "早期参加枠"
    early_monthly: "6,300円＋税"
    early_monthly_incl: "6,930"
    list_monthly: "9,000円＋税"
    list_monthly_incl: "9,900"
    early_target: "2026年9月4日以降のお申し込み対象"

