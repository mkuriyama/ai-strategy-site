site_name: AI戦略実践プロジェクト
site_description: 事業を動かす方々のための、AI戦略実装の型を月次で作る・動かす実践の場（主催：栗山実／株式会社アンテカニス）
site_author: AI戦略実践プロジェクト
site_url: https://ai-strategy.antecanis.com/

theme:
  name: material
  language: ja
  custom_dir: overrides
  logo: assets/logo-mincho-white.svg
  favicon: assets/favicon.png
  # ダークモードは置かない（2026年9月に廃止）。ホームとランディング系ページは常に明るい地で
  # 描くので、切り替えが効くのは本文ページだけという中途半端な状態になっていた。
  # palette を1つ（マッピング）にすると、Material は切り替えボタンも、以前に選んだ
  # 配色を localStorage から戻すスクリプトも出さない（ダークを選んでいた人も明るい地に戻る）
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Noto Sans JP
    code: Roboto Mono
  features:
    # 用語集ツールチップ（abbreviations）を有効化
    - content.tooltips
    - content.code.copy
    # 上部タブ＋サイドバーのポータル型ナビゲーション
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - stylesheets/extra.css

# フォーム（/subscribe/・/join/corporate/）の送信、UTM の保持、計測（GA4・Meta・Google 広告）。
# 全ページで読み込むが、フォームの無いページでは UTM を覚えて、ページビューと申込クリックを送るだけ。
# schedule.js は、開催日が過ぎた日程を、次のビルドを待たずに「開催済み」にする（hooks/schedule.py と同じ決まり）
extra_javascript:
  - javascripts/forms.js
  - javascripts/schedule.js

# 日本語（CJK）対応の abbreviations ツールチップを有効化する hook
# seo_files.py は AIO 用の llms.txt をビルド時に生成する（extra: と各ページの description から）
hooks:
  # 回の予定（extra.schedule）から、次回・開催済み・開催履歴の日付を作る（最初に動く）
  - hooks/schedule.py
  - hooks/abbr_cjk.py
  - hooks/seo_files.py
  - hooks/export_data.py
  # 広告の計測タグを、Material を通らない静的ページ（/welcome/・/paused/）にも差し込む
  - hooks/tracking.py

# 日本語検索対応（CJK 分割に対応）
plugins:
  - search:
      lang:
        - ja
        - en
  # 変動情報の単一ソース化（extra: のデータ／main.py のマクロを各ページで参照）
  - macros:
      module_name: main
  # 統合・改称した旧URLの転送（メール等で配布済みのリンクを切らさない）
  - redirects:
      redirect_maps:
        join/register.md: join/index.md
        # 月次テーマは開催履歴と同じ内容だったので統合（2026年9月）
        sessions/themes.md: sessions/history.md
        # 開催予定はセッションページに吸収（2026年9月）
        sessions/schedule.md: sessions/index.md
        # スタートガイドはライブラリー（B）の /guide/ へ移設（2026年9月）。
        # **外部URLへの転送**（プラグインが対応している）。案内メール・決済完了
        # ページ・Circle から配ったリンクが生きているので、この設定は消さないこと。
        # ⚠ 行き先のホストは2026年9月に ai-strategy-news → ai-strategy-library へ改称。
        # 旧ホストも同じ配信先に付いたままなので、古い転送先でも開けはする
        start-guide.md: https://ai-strategy-library.antecanis.com/guide/getting-started/
        # 旧来の申込リンク /apply/（送信済みの案内メールに残っている）。以前は GAS を
        # 直に開く静的HTMLだったが、申込（Stripe）の入口 extra.join_url へ転送する。
        # 行き先は下の extra.join_url と**同じ値**（YAML のアンカー &join_url を
        # extra.join_url が *join_url で参照）。申込URLを変えるときはここ1か所。消さないこと
        apply/index.md: &join_url https://go.antecanis.com/ai-strategy-join
  # スクリーンショット等をクリックで拡大
  - glightbox:
      auto_caption: false
      touchNavigation: true
  # OGP / ソーシャルカードの自動生成（SEO・共有）
  # フォント取得にネットワークを要するため、生成は CI 等でのみ有効化する。
  # ローカルビルドは `CARDS` 未設定＝無効（既定）。CI では env: CARDS: true。
  - social:
      cards: !ENV [CARDS, false]
      cards_layout_options:
        background_color: "#004455"
        color: "#ffffff"

markdown_extensions:
  # 用語集ツールチップ（*[TERM]: 定義 形式）
  - abbr
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - admonition
  - toc:
      permalink: true
      # CJK 見出しでも意味のあるアンカーを生成（Unicode保持）。
      # 既定の slugify は非ASCIIを除去し _2 等になるため上書き。
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # 全ページに用語集の定義を自動付与（ツールチップ用）
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
      auto_append:
        - includes/abbreviations.md

# ツールチップ用のインクルードと、サイズの大きい元画像はページ化・配信しない
exclude_docs: |
  includes/
  assets/antecanis_favicon.png
  assets/antecanis_logo_ss.png
  assets/antecanis_logo_white.png
  assets/profile_kuriyama_DSC2043.jpg
  assets/profile_kuriyama_DSC2043_s.jpg
  assets/profile_kuriyama_DSC2043_s2.jpg

nav:
  - ホーム: index.md
  # 申込の判断に効くものだけを「プロジェクトについて」に置く。
  # 「このプロジェクトを紹介する」（紹介用チラシ）は既存参加者向けなので nav から外した
  # ―― ページは残っており、URLを知っていれば開ける。
  - プロジェクトについて:
      - 背景と狙い: about/index.md
      - セッションの進め方と開催予定: sessions/index.md
      - 開催履歴: sessions/history.md
      - 設計思想: about/philosophy.md
      - 主催者プロフィール: about/profile.md
      # 関連リンク（ライブラリー・メンバーサイト・主催会社）。**タブは増やさない**
      # ―― ここは「プロジェクトについて」の配下で、申込導線の外側に置く札
      - 関連リンク: about/links.md
  # 用語集はライブラリー（B）の /terms/ に移した。ページは前のURLのまま残して
  # あるが、nav・検索・sitemap・llms.txt からは外している（ダイジェストと同じ扱い）
  # スタートガイドもライブラリー（B）の /guide/ に移した（2026年9月）。あちらは
  # **参加している方の手元**という位置づけで、今後ガイドを増やしていく置き場。
  # こちらは転送だけ残す（下の redirect_maps）。nav には戻さない。
  - 参加する:
      - 参加費とお申し込み: join/index.md
      - 法人の方へ: join/corporate.md
  # ⚠ ライブラリー（B）へのタブは**置かない**。このサイトは広告からの申込
  # コンバージョンが目的で、グローバルナビの項目は申込導線から目を逸らす。
  # B への導線は「プロジェクトについて」の本文とフッタに置く（下記 §導線の方針）。

extra:
  # GA4（Material の標準の組み込み）。広告のタグは下の tracking:
  analytics:
    provider: google
    property: G-2H53XSH9YC

  # ────────────────────────────────────────────────────────────
  # 広告の計測タグ（2026年11月〜）。**ID が空なら、そのタグは一切読み込まない。**
  # overrides/partials/tracking.html が全ページに、hooks/tracking.py が /welcome/・/paused/ に
  # 入れる。送るイベントは docs/javascripts/forms.js（メール登録の成功＝Lead・コンバージョン、
  # 申込（Stripe）ボタンのクリック＝InitiateCheckout・コンバージョン、法人問い合わせ＝Contact）。
  # 本番ホスト（hosts）以外では動かない ―― ローカルの確認や検証用の面で数字を汚さないため。
  # 試すときは META_PIXEL_ID=… TRACKING_HOSTS=127.0.0.1 python3 -m mkdocs serve
  # ────────────────────────────────────────────────────────────
  tracking:
    # Meta ピクセルの ID（数字だけ）
    meta_pixel_id: !ENV [META_PIXEL_ID, ""]
    # Google 広告のタグ ID（AW-で始まる）
    google_ads_id: !ENV [GOOGLE_ADS_ID, ""]
    # コンバージョンのラベル（Google 広告で作ったコンバージョンの「AW-…/」の後ろ）。空なら送らない
    google_ads_lead_label: !ENV [GOOGLE_ADS_LEAD_LABEL, ""]   # メール登録
    google_ads_join_label: !ENV [GOOGLE_ADS_JOIN_LABEL, ""]   # 申込（Stripe）ボタンのクリック
    google_ads_inquiry_label: !ENV [GOOGLE_ADS_INQUIRY_LABEL, ""]   # 法人問い合わせの送信
    # タグを動かすホスト（カンマ区切り）
    hosts: !ENV [TRACKING_HOSTS, "ai-strategy.antecanis.com"]

  # ────────────────────────────────────────────────────────────
  # 変動情報の単一ソース（§3）。更新は毎回このブロックだけ。
  # ホーム(overrides/home.html)・/sessions/・join 等が参照する。
  # ────────────────────────────────────────────────────────────
  # メール登録の入口。**サイト内のページ**（2026年9月〜。以前は Mailchimp のホスト型LP）。
  # サイト相対で書く（テンプレートとマクロが各ページからの相対パスに直す）
  register_url: subscribe/
  # フォームの送信先・Turnstile・ご案内メールの件名（/subscribe/・/join/corporate/ が参照）
  forms:
    # ゲートウェイ（go.antecanis.com）。検証用リビジョンで試すときは
    # FORMS_API_BASE=https://staging---… python3 -m mkdocs serve
    api_base: !ENV [FORMS_API_BASE, "https://go.antecanis.com"]
    # Cloudflare Turnstile のサイトキー（公開してよい値。ウィジェット「AISIA forms」）。
    # 空にすると、/subscribe/ と /join/corporate/ はフォームの代わりに旧LP・メールへの導線を出す
    turnstile_sitekey: !ENV [TURNSTILE_SITEKEY, "0x4AAAAAAFFE4MRIh0cbQOTJ"]
    # 登録直後に届くご案内メールの件名（実際のメールと一致させる。thanks に表示）
    welcome_subject: "【AI戦略実践PJ】メール登録ありがとうございます"
    # JavaScript が無効な方の代替（旧LP。過去の投稿からもリンクされているので残してある）
    noscript_url: https://mailchi.mp/antecanis/ai-strategy
    # 「知ったきっかけ」は任意（2026年11月〜）。**空欄のときに送る値**（空のまま送る。ゲートウェイ v10 から
    # 受け付け、Mailchimp の SOURCE001 は空のまま・タグは src:none）
    source_blank: ""
    # ゲートウェイが空欄を拒んだとき（v9 まで）だけ、この値で1回送り直す。v10 が本番になったら消してよい
    source_fallback: "その他"
  # 実績数値（/subscribe/・/join/corporate/ の実績帯とチップが参照）。
  # satisfaction は新しい回のアンケートが加わるたびに再計算する（未回答も分母に含める）
  stats:
    paid_members: "80名超"
    rounds_label: "第6回"
    rounds_note: "まで開催（2026年5月〜）"
    subscribers: "約200名"
    satisfaction: "97%"
    satisfaction_note: "第1〜5回の参加者アンケート（延べ117件）で「参加・視聴して良かった」に「とてもそう思う」「ややそう思う」と回答した割合。"
  # ニュースサイト（B）。nav の「読む」タブと llms.txt の「関連サイト」が参照する
  news_site_url: https://ai-strategy-library.antecanis.com/d/
  # 申込（Stripe）の直リンク。独自ドメイン配下に統一（リンク先の差し替えはゲートウェイ側で行う）
  # ⚠ 値は plugins.redirects の apply/index.md に書いてある（YAML アンカー）。/apply/ の転送先と一致させるため
  join_url: *join_url
  # ────────────────────────────────────────────────────────────
  # 回の予定（2026年11月〜 **日程の正本はここだけ**）。1回＝1要素、開始は日本時間の ISO。
  # 曜日は書かない（日付から計算する）。テーマ（theme）と問い（question）は任意 ――
  # 省いた回は「テーマは決まりしだい」と出る。開催済みの回のテーマは extra.history の title から。
  # ここから hooks/schedule.py が、次回の表記（お知らせバー等）・これからの開催・全回の一覧・
  # 申込の時期ごとの初回のお支払い日・開催履歴の日付・構造化データ（Event）を作る。
  # **開催が終わっても書き換えは要らない**（開始から3時間で「開催済み」になる。ブラウザ側でも）。
  # 新しい回の日程が決まったら末尾に足すだけ。
  # ────────────────────────────────────────────────────────────
  schedule:
    - round: 1
      a: "2026-05-26T20:00:00+09:00"
      b: "2026-06-15T20:00:00+09:00"
    - round: 2
      a: "2026-06-23T20:00:00+09:00"
      b: "2026-07-10T20:00:00+09:00"
    - round: 3
      a: "2026-07-21T20:00:00+09:00"
      b: "2026-08-03T20:00:00+09:00"
    - round: 4
      a: "2026-08-18T20:00:00+09:00"
      b: "2026-09-03T20:00:00+09:00"
    - round: 5
      a: "2026-09-15T20:00:00+09:00"
      b: "2026-10-02T20:00:00+09:00"
    - round: 6
      theme: "AI対話と企業の命運"
      question: "答えのない問いをAI対話で解く力は、個人と企業の命運をどう分けるか。"
      a: "2026-10-20T20:00:00+09:00"
      b: "2026-11-06T20:00:00+09:00"
    - round: 7
      theme: "AI駆動開発と企業戦略"
      question: "システムを作るコストと時間が急激に圧縮された今、戦略と価値創造の主戦場はどこへ移るか。"
      a: "2026-11-17T20:00:00+09:00"
      b: "2026-11-30T20:00:00+09:00"
    - round: 8
      a: "2026-12-15T20:00:00+09:00"
      b: "2027-01-06T20:00:00+09:00"
  # ホーム「新着」の先頭リンク（新しい回が終わったらここを更新）
  latest_digest:
    url: "sessions/history/"
    label: "第6回までの開催履歴を公開中"
  # 開催履歴（sessions/history.md が history_cards() で描画。新しい回が終わったら先頭に追加）
  # image は docs/ 基準のパス。各回ダイジェストの図1を assets/img/history/ に切り出してある。
  # digests は**リンクではなく対応表**。公開ページからは外してあり、
  # `DIGEST_EXPORT=1` のビルドで本文を書き出すときだけ使う（会員限定の場所へ運ぶ材料）。
  # highlight（2〜4文）・highlight_image・highlight_caption・month は任意。/subscribe/ の
  # 「直近の回から」が**先頭の回**の値を出す（highlight が無ければ summary、画像が無ければ画像なし）
  history:
    - round: 6
      title: "AI対話と企業の命運 ── 答えのない問いをAI対話で解く力は、個人と企業の命運をどう分けるか"
      area: "[1C] 人間の可能域の拡張／[2C] 組織学習と人材育成の統合／[2E] 事業戦略と組織戦略の共転換"
      month: "2026年10月"
      summary: "全員が同じ強さのAIを相手に同じ問いで対話し、その深まりを1往復ごとに点数化して並べて比べた回。内部の仕組みだけが違う3社の5年後を描き、AI対話の力が個人にとどまるか組織に広がるかが、企業の競争力をどう分けるかまでを考えた。"
      image: "assets/img/history/vol-06.svg"
      highlight: "全員が同じ強さのAIを相手に、同じ問いで一定時間対話し、その深まりを1往復ごとに点数化して並べて比べました。分かれ目は入力の長さではなく、その数十字で何を書くか ―― 方向を持ち込む、見方を振る、トレードオフを突きつける、といった問いの立て方でした。いちばん効いたのは、1回目のあとに上位の方の進め方を声で聞くこと。テキストだけでは伝わらない勘所が渡り、2回目で多くの方が伸びました。"
      # ⚠ この枠の画像は**ラスタ（PNG/GIF）にする**。携帯では幅が約233pxまで縮むので、
      # 横長の SVG を入れると文字が4px相当になり check_mobile が落ちる（実際に落とした）
      highlight_image: "assets/img/history/vol-06-highlight.png"
      highlight_caption: "対話アリーナの記録（1回目・社長の三つの問い）。線は一人1本で匿名、横線はAIだけで考えさせた参考ライン"
    - round: 5
      title: "AI戦略の未来シナリオ"
      area: "[3D] 時間軸戦略のシフト／[3E] 収益構造と戦場のシフト"
      summary: "AIによって産業構造が激変する未来シナリオを描けるか、対話AIに聞く以上の広さと深さでシナリオを出し切れるか、自社の判断によって分かれる道筋を描けるかに挑戦した。"
      image: "assets/img/history/vol-05-highlight.gif"
    - round: 4
      title: "物理世界に接地したAIは、競争のルールをどう書き換えるか"
      area: "[1E] 物理世界との接地と作用"
      summary: "航空写真をAIが読み進めて候補地を探す実践アプリと、Sense→Think→Actのループを通じて、誰でも簡単に作れる時代の競争優位がどこに宿るのかを架空企業のストーリーで考えた回。"
      image: "assets/img/history/vol-04.svg"
      digests: ["digests/vol-04.md", "digests/vol-04b.md"]
    - round: 3
      title: "AI戦略 × 組織レイヤーへのインパクト"
      area: "[2A] 情報流通の血流化／[2D] 経営の知的オペレーション機構化／[2E] 事業戦略と組織戦略の共転換"
      summary: "暗黙知の表出化、人材と課題の意味マッチング、集合知のリアルタイム構造化、そして「250名分の仕事が浮く」設定で利害の衝突に向き合う人材戦略デザインゲーム。組織変革レイヤーを実地で扱った回。"
      image: "assets/img/history/vol-03.svg"
      digests: ["digests/vol-03.md", "digests/vol-03b.md"]
    - round: 2
      title: "AIと共に、戦略の大転換を考える"
      area: "[3A] 顧客価値／[3B] 顧客接点／[3C] 差別化資産のシフト"
      summary: "AI戦略対抗戦とAI事業デザインゲームの2つを通じて、競争のルール（顧客価値・顧客接点・差別化資産）がAIでどう書き換わるかを体験。戦略を「AIと共に、AIを前提に」描き直した回。"
      image: "assets/img/history/vol-02.svg"
      digests: ["digests/vol-02.md", "digests/vol-02b.md"]
    - round: 1
      title: "人間の認知容量の解除 ── 情報×AIの戦略インパクト"
      area: "[1A] 人間の認知容量の解除"
