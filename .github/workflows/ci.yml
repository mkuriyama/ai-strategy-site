name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main
  # PR では検証（strict ビルド・携帯の幅の検査）だけを回し、公開はしない
  pull_request:
    branches:
      - main
  # 手動実行も可能にする
  workflow_dispatch:

# gh-pages ブランチへ push するための権限
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ hashFiles('requirements.txt') }}
          path: ~/.cache/pip
          restore-keys: |
            mkdocs-material-

      # ソーシャルカード（OGP画像）生成に必要なシステムライブラリ
      - name: Install image libraries (for social cards)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      # リンク切れ・未解決の参照があればここで止める（壊れた版を公開しない）。
      # ソーシャルカードは次の gh-deploy で生成するので、ここでは CARDS を付けず速く回す。
      - name: Validate build (strict)
        run: mkdocs build --strict --site-dir /tmp/site-strict

      # 携帯の幅（320〜412px）で開き、横へのはみ出しと、図の文字が小さすぎないかを測る。
      # PCの幅では何も起きないので、実際に描画して確かめる（scripts/check_mobile.py の冒頭）
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check mobile layout
        run: python scripts/check_mobile.py /tmp/site-strict

      - name: Build and deploy to gh-pages
        if: github.event_name != 'pull_request'
        env:
          # OGP/ソーシャルカードの自動生成を有効化（Google Fontsへのアクセスが必要）
          CARDS: "true"
        run: mkdocs gh-deploy --force --clean
